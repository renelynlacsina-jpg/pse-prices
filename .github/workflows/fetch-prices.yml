name: Fetch PSE Prices
on:
  schedule:
    - cron: '0,30 1-7 * * 1-5'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Fetch PSE prices
        run: python fetch_prices.py
      - name: Copy portfolio as index.html
        run: |
          if [ ! -f index.html ] && [ -f portfolio.html ]; then
            cp portfolio.html index.html
          fi
      - name: Commit updated prices
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/prices.json index.html || true
          git diff --staged --quiet || git commit -m "chore: update PSE prices"
          git push
