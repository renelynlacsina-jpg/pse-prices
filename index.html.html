<title>PSE Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg:#edf2f7;--surface:#fff;--s2:#f4f8fc;--border:#dce4ef;
  --t1:#0f1923;--t2:#3d5166;--t3:#6b859e;
  --green:#059669;--gbg:#ecfdf5;--red:#dc2626;--rbg:#fef2f2;
  --amber:#d97706;--abg:#fffbeb;--blue:#2563eb;
  --chart-fill:rgba(217,119,6,.14);--chart-stroke:rgba(217,119,6,.5);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0c1118;--surface:#141b24;--s2:#1a2330;--border:#263040;
  --t1:#e8eef5;--t2:#9ab0c8;--t3:#6a8aaa;
  --green:#10b981;--gbg:#022c22;--red:#f87171;--rbg:#2d1515;
  --amber:#fbbf24;--abg:#2d1f00;--blue:#60a5fa;
  --chart-fill:rgba(251,191,36,.1);--chart-stroke:rgba(251,191,36,.4);
}}
:root[data-theme=dark]{
  --bg:#0c1118;--surface:#141b24;--s2:#1a2330;--border:#263040;
  --t1:#e8eef5;--t2:#9ab0c8;--t3:#6a8aaa;
  --green:#10b981;--gbg:#022c22;--red:#f87171;--rbg:#2d1515;
  --amber:#fbbf24;--abg:#2d1f00;--blue:#60a5fa;
  --chart-fill:rgba(251,191,36,.1);--chart-stroke:rgba(251,191,36,.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;min-height:100vh}
button{font-family:inherit;cursor:pointer}input,select{font-family:inherit}
.mono{font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums}

/* NAV */
.topnav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0;padding:0 20px;height:52px;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;margin-right:24px;color:var(--t1)}
.brand-icon{background:var(--green);color:#fff;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.navlink{padding:0 12px;height:52px;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--t2);border:none;background:none;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s}
.navlink:hover{color:var(--t1)}
.navlink.active{color:var(--green);border-bottom-color:var(--green)}
.nav-spacer{flex:1}
.nav-status{font-size:11.5px;color:var(--t3);display:flex;align-items:center;gap:5px;margin-right:8px;white-space:nowrap}
.nav-status .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.nav-status .dot.fetching{background:var(--amber);animation:pulse .9s ease-in-out infinite alternate}
.nav-status .dot.error{background:var(--red)}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
.refresh-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;margin-right:6px;transition:color .15s,background .15s;font-family:inherit}
.refresh-btn:hover:not(:disabled){background:var(--s2);color:var(--t1)}
.refresh-btn:disabled{opacity:.5;cursor:default}
.refresh-btn svg{transition:transform .6s linear}
.refresh-btn.spinning svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.theme-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 9px;color:var(--t2);font-size:12px;cursor:pointer}
.theme-btn:hover{background:var(--s2)}

/* BREADCRUMB + HEADER */
.page-header{padding:18px 24px 0;display:flex;align-items:flex-end;justify-content:space-between}
.bread{font-size:12px;color:var(--t3);margin-bottom:4px}
.bread span{cursor:pointer;color:var(--t3)}
.bread span:hover{color:var(--t2)}
.page-title{font-size:20px;font-weight:700;line-height:1.2;text-wrap:balance}
.content{padding:18px 24px 32px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--green);color:#fff}
.btn-ghost{background:var(--s2);color:var(--t2);border:1px solid var(--border)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:var(--red);color:#fff}

/* CHART */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 18px 10px;margin-bottom:16px}
.chart-wrap{position:relative;height:240px}
.chart-legend{display:flex;gap:16px;font-size:12px;color:var(--t2);margin-top:6px;justify-content:center}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi.hi{background:var(--gbg);border-color:rgba(5,150,105,.2)}
.kpi-label{font-size:10.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.kpi.hi .kpi-label{color:var(--green)}
.kpi-value{font-size:19px;font-weight:700;font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:3px;font-family:'Plus Jakarta Sans',sans-serif}
.kpi.hi .kpi-sub{color:var(--green);opacity:.8}

/* TABLE */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{border-bottom:1.5px solid var(--border)}
th{padding:9px 12px;text-align:left;font-size:10.5px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--t1)}
td.name-cell{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--s2)}
.tfoot-row td{background:var(--s2);font-weight:700;border-top:2px solid var(--border);border-bottom:none}
.tfoot-row:hover td{background:var(--s2)}
.pos{color:var(--green)}.neg{color:var(--red)}

/* STOCK CHIP */
.chip{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11.5px;font-weight:700;background:var(--s2);border:1px solid var(--border);font-family:'Plus Jakarta Sans',sans-serif;color:var(--t1)}
.chip.lnk{color:var(--blue);background:rgba(37,99,235,.07);border-color:rgba(37,99,235,.2)}

/* ICON BTNS */
.acts{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.ibtn{background:none;border:none;cursor:pointer;color:var(--t3);padding:4px;border-radius:4px;display:flex;transition:color .1s,background .1s}
.ibtn:hover{color:var(--t1);background:var(--s2)}
.ibtn.del:hover{color:var(--red)}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tab{padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--t2);display:flex;align-items:center;gap:6px;transition:background .1s,color .1s}
.tab:hover{background:var(--s2);color:var(--t1)}
.tab.active{background:var(--gbg);color:var(--green)}

/* STATUS */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif}
.badge.up{background:var(--abg);color:var(--amber)}
.badge.cr{background:var(--gbg);color:var(--green)}

/* PAGINATION */
.paginator{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-top:1px solid var(--border);font-size:13px;color:var(--t2)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;width:420px;max-width:95vw;max-height:92vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px}
.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--t2);margin-bottom:3px}
.field input,.field select{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--s2);color:var(--t1);font-size:13px}
.field input:focus,.field select:focus{outline:2px solid var(--green);outline-offset:-1px;border-color:transparent}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

@media(max-width:720px){.kpi-row{grid-template-columns:1fr 1fr}.fg{grid-template-columns:1fr}}
@media(max-width:480px){.kpi-row{grid-template-columns:1fr}}
</style>

const fmt  = (n,d=2) => new Intl.NumberFormat('en-PH',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const fmtP = n => (n>=0?'+':'')+fmt(n,2)+'%';
const peso = n => '₱'+fmt(n,2);
const cls  = n => n>=0?'pos':'neg';

function stockCalc(s){
  // Shares and cost are always derived from trades — never stored separately
  const buyT   = trades.filter(t=>t.symbol===s.ticker&&t.type==='buy');
  const divT   = trades.filter(t=>t.symbol===s.ticker&&t.type==='stk_div');
  const shares = buyT.reduce((a,t)=>a+t.qty,0)+divT.reduce((a,t)=>a+t.qty,0);
  const cost   = buyT.reduce((a,t)=>a+t.net,0);
  const mkt    = shares*s.last;
  const gl     = mkt-cost;
  const glp    = cost>0?(gl/cost)*100:0;
  const avg    = shares>0?cost/shares:0;
  return {...s, shares, cost, avg, mkt, gl, glp};
}

function yearOf(d){ return parseInt(d.split('-')[0]); }
function monthOf(d){ return parseInt(d.split('-')[1])-1; }

// ─── PORTFOLIO CHART DATA ────────────────────────────────────────────────────
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function computeCostTimeline(){
  // Build cumulative cost basis from actual trade data, one point per year
  const buyTrades = trades.filter(t=>t.type==='buy').sort((a,b)=>a.date.localeCompare(b.date));
  if(!buyTrades.length) return {labels:[],cost:[],mktPoint:[]};

  const firstYear = parseInt(buyTrades[0].date.slice(0,4));
  const now       = new Date();
  const thisYear  = now.getFullYear();
  const labels=[], costData=[], mktPoint=[];

  let cumCost = 0;
  for(let y=firstYear; y<=thisYear; y++){
    // Add all trades up to Dec 31 of this year
    buyTrades.forEach(t=>{ if(parseInt(t.date.slice(0,4))===y) cumCost+=t.net; });
    labels.push(String(y));
    costData.push(+(cumCost/1000).toFixed(3));
    // Market value dot only at current year
    if(y===thisYear){
      const mkt = stocks.map(stockCalc).reduce((s,st)=>s+st.mkt,0);
      mktPoint.push(+(mkt/1000).toFixed(3));
    } else {
      mktPoint.push(null);
    }
  }
  return {labels, cost:costData, mktPoint};
}

function monthlyIncome2026(){
  const arr = Array(12).fill(0);
  history.filter(h=>yearOf(h.date)===2026).forEach(h=>{ arr[monthOf(h.date)]+=h.net; });
  return arr;
}

function yearlyByStock(){
  const years=[2021,2022,2023,2024,2025,2026];
  const tickers=[...new Set(history.map(h=>h.stock))].sort();
  const palette=['#2563eb','#10b981','#f97316','#dc2626','#8b5cf6','#ec4899','#0ea5e9','#84cc16','#a855f7','#f59e0b','#06b6d4','#22c55e','#ef4444','#6366f1'];
  const datasets = tickers.map((t,i)=>({
    label:t,
    data:years.map(y=>history.filter(h=>h.stock===t&&yearOf(h.date)===y).reduce((s,h)=>s+h.net,0)),
    backgroundColor:palette[i%palette.length],
    borderWidth:0,
  }));
  const totals = years.map(y=>history.filter(h=>yearOf(h.date)===y).reduce((s,h)=>s+h.net,0));
  return {labels:years.map(y=>'Jan '+y), datasets, totals};
}

// ─── DASHBOARD DATA ──────────────────────────────────────────────────────────
function computeDashboard(){
  const ss = stocks.map(stockCalc);
  const totalCost = ss.reduce((a,s)=>a+s.cost,0);
  const totalMkt  = ss.reduce((a,s)=>a+s.mkt,0);
  const totalGL   = totalMkt - totalCost;
  const totalGLp  = (totalGL/totalCost)*100;
  const totalDiv  = history.reduce((a,h)=>a+h.net,0);
  const totalReturn  = totalGL + totalDiv;
  const totalReturnP = (totalReturn/totalCost)*100;
  const firstDate = trades.filter(t=>t.type==='buy').sort((a,b)=>a.date.localeCompare(b.date))[0]?.date;
  const periodYears = firstDate ? (Date.now()-new Date(firstDate).getTime())/(365.25*24*3600*1000) : 1;
  const cagr = ((1+totalReturnP/100)**(1/periodYears)-1)*100;
  const div2025 = history.filter(h=>yearOf(h.date)===2025).reduce((a,h)=>a+h.net,0);
  const yieldOnCost = (div2025/totalCost)*100;
  const divByStock = {};
  history.forEach(h=>{ divByStock[h.stock]=(divByStock[h.stock]||0)+h.net; });
  const stockData = ss.map(s=>({
    ticker:s.ticker, cost:s.cost, mkt:s.mkt, gl:s.gl, glp:s.glp,
    divTotal: divByStock[s.ticker]||0,
    totalReturn: s.gl+(divByStock[s.ticker]||0),
    totalReturnP: ((s.gl+(divByStock[s.ticker]||0))/s.cost)*100
  })).sort((a,b)=>b.totalReturnP-a.totalReturnP);
  return {totalCost,totalMkt,totalGL,totalGLp,totalDiv,totalReturn,totalReturnP,cagr,yieldOnCost,periodYears,stockData};
}

function textColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--t2').trim()||'#4c5f72'; }
function borderColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--border').trim()||'#dce4ef'; }

function makePortfolioChart(){
  if(charts.portfolio){ charts.portfolio.destroy(); delete charts.portfolio; }
  const el = document.getElementById('portfolioChart');
  if(!el) return;
  const tc = textColor(), bc = borderColor();
  const {labels, cost, mktPoint} = computeCostTimeline();

  // Determine gain/loss color for market value dot
  const totalMkt  = stocks.map(stockCalc).reduce((s,st)=>s+st.mkt,0);
  const totalCost = stocks.reduce((s,st)=>s+st.cost,0);
  const mktColor  = totalMkt>=totalCost ? '#10b981' : '#f87171';

  // Y-axis ceiling: a bit above the max of cost or market value
  const maxVal = Math.max(...cost.filter(Boolean), totalMkt/1000);
  const yMax   = Math.ceil(maxVal/50)*50 + 50;

  charts.portfolio = new Chart(el, {
    type:'line',
    data:{
      labels,
      datasets:[
        {
          label:'Cost Basis',
          data:cost,
          fill:true,
          stepped:'before',
          borderColor:'rgba(217,119,6,.7)',
          backgroundColor:'rgba(217,119,6,.12)',
          borderWidth:2,
          pointRadius:0,
          pointHitRadius:8,
          tension:0,
        },
        {
          label:'Market Value',
          data:mktPoint,
          fill:false,
          borderColor:mktColor,
          backgroundColor:mktColor,
          borderWidth:0,
          pointRadius:7,
          pointHoverRadius:9,
          pointStyle:'circle',
          tension:0,
          spanGaps:false,
        },
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:true,position:'bottom',labels:{boxWidth:8,boxHeight:8,usePointStyle:true,pointStyle:'circle',color:tc,font:{family:'Plus Jakarta Sans',size:11}}},
        tooltip:{
          callbacks:{
            label:ctx=>{
              if(ctx.raw===null) return null;
              return ` ${ctx.dataset.label}: ₱${fmt(ctx.raw*1000,0)}`;
            },
            afterBody: items => {
              // Show G/L when both datasets visible at same index
              const costVal = items.find(i=>i.datasetIndex===0)?.raw;
              const mktVal  = items.find(i=>i.datasetIndex===1)?.raw;
              if(costVal&&mktVal){
                const gl = (mktVal-costVal)*1000;
                const glp = ((mktVal-costVal)/costVal*100).toFixed(2);
                return [`G/L: ${gl>=0?'+':''}₱${fmt(gl,0)} (${gl>=0?'+':''}${glp}%)`];
              }
              return [];
            }
          }
        }
      },
      scales:{
        x:{
          grid:{color:bc},
          ticks:{
            color:tc,
            font:{family:'Plus Jakarta Sans',size:11},
            maxRotation:0,
            autoSkip:true,
            // Only label Jan of each year
            callback:(val,idx)=>{
              const lbl = labels[idx]||'';
              return lbl.startsWith('Jan') ? lbl.split(' ')[1] : '';
            }
          }

// Yahoo Finance .PS suffix for Philippine Stock Exchange (e.g. ALI.PS)
// ─── PRICE FETCH CONFIG ───────────────────────────────────────────────────────
const YF_SUFFIX = '.PS';
const YF_OVERRIDE = {}; // ticker overrides if Yahoo symbol differs
const YF_FIELDS = 'regularMarketPrice,regularMarketChangePercent,exDividendDate,dividendDate,trailingAnnualDividendRate';

// ↓ Paste your Cloudflare Worker URL here after deploying pse-proxy-worker.js
// e.g. 'https://pse-proxy.YOUR-NAME.workers.dev'
const WORKER_URL = 'https://divine-sun-49e8.renelyn-lacsina.workers.dev';

async function fetchBatch(symbols) {
  const symStr = symbols.join(',');

  // 1. Try your own Cloudflare Worker first (fastest, no CORS issues)
  if (WORKER_URL) {
    try {
      const res = await fetch(`${WORKER_URL}?symbols=${encodeURIComponent(symStr)}`, { signal: AbortSignal.timeout(10000) });
      if (res.ok) {
        const json = await res.json();
        const quotes = json?.quoteResponse?.result;
        if (Array.isArray(quotes) && quotes.length) return quotes;
      }
    } catch { /* fall through */ }
  }

  // 2. Fallback: public CORS proxies wrapping Yahoo Finance
  const BASES = [
    `https://query1.finance.yahoo.com/v8/finance/quote?symbols=${symStr}&fields=${YF_FIELDS}`,
    `https://query2.finance.yahoo.com/v8/finance/quote?symbols=${symStr}&fields=${YF_FIELDS}`,
    `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symStr}&fields=${YF_FIELDS}`,
  ];
  const PROXIES = [
    b => `https://corsproxy.io/?${encodeURIComponent(b)}`,
    b => `https://api.allorigins.win/raw?url=${encodeURIComponent(b)}`,
    b => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(b)}`,
  ];
  for (const base of BASES) {
    for (const proxy of PROXIES) {
      try {
        const res = await fetch(proxy(base), { signal: AbortSignal.timeout(12000) });
        if (!res.ok) continue;
        const json = await res.json();
        const quotes = json?.quoteResponse?.result;
        if (Array.isArray(quotes) && quotes.length) return quotes;
      } catch { /* try next */ }
    }
  }
  return [];
}

function fmtDateLabel(unixTs) {
  // Format Unix timestamp → "Aug 19, 2026"
  return new Date(unixTs * 1000).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

function applyDividendDetection(quotes) {
  const now = Math.floor(Date.now() / 1000);
  const WINDOW = 120 * 24 * 3600; // look 120 days ahead
  let detected = 0;

  quotes.forEach(q => {
    const ticker = q.symbol.replace(YF_SUFFIX, '');
    const exTs   = q.exDividendDate;   // Unix timestamp or null
    const payTs  = q.dividendDate;     // Unix timestamp or null

    if (!exTs) return;

    const isUpcoming = exTs > now && exTs < now + WINDOW;
    const isPast     = exTs <= now && exTs > now - WINDOW;

    if (!isUpcoming && !isPast) return;

    const idx = upcoming.findIndex(u => u.stock === ticker);
    if (idx === -1) return;

    const u = upcoming[idx];
    // Don't overwrite a manually-set Credited entry with an older ex-date
    if (u.status === 'cr' && payTs && payTs * 1000 < Date.now()) return;

    const status       = isUpcoming ? 'up' : 'cr';
    const status_label = isUpcoming ? 'Upcoming' : 'Credited';
    const exLabel      = fmtDateLabel(exTs);
    const payLabel     = payTs ? fmtDateLabel(payTs) : u.pay;

    // Estimate per-share from trailing annual rate ÷ recent payment count
    // Use history to count payments in the last 12 months for this stock
    const cutoff = new Date(); cutoff.setFullYear(cutoff.getFullYear() - 1);
    const recentPayments = history.filter(h => h.stock === ticker && new Date(h.date) >= cutoff);
    const payCount = recentPayments.length || 1;
    const annualRate = q.trailingAnnualDividendRate || 0;
    // Only auto-fill per if we have a reliable estimate and current value is 0
    const estimatedPer = annualRate > 0 ? +(annualRate / payCount).toFixed(4) : u.per;
    const per = u.per > 0 ? u.per : estimatedPer;
    // Compute shares from trades (source of truth)
    const sharesFromTrades = trades.filter(t=>t.symbol===ticker).reduce((a,t)=>a+t.qty,0);
    const sharesForDiv = sharesFromTrades || u.shares;
    const net = per > 0 ? +(sharesForDiv * per * 0.9).toFixed(2) : u.net; // 10% withholding tax

    // Only update if something meaningful changed
    if (u.ex !== exLabel || u.status !== status) {
      upcoming[idx] = { ...u, status, status_label, ex: exLabel, pay: payLabel, per, net };
      detected++;
    }
  });

  if (detected > 0) save('pse_upcoming', upcoming);
  return detected;
}

let lastDetected = 0;

async function fetchMarketPrices() {
  if (isFetching) return;
  isFetching = true;
  fetchError = null;
  lastDetected = 0;
  updateNavStatus();

  const symbols = stocks.map(s => (YF_OVERRIDE[s.ticker] || s.ticker) + YF_SUFFIX);
  const quotes  = await fetchBatch(symbols);

  // ── Prices ──
  const priceMap = {};
  quotes.forEach(q => {
    if (!q.regularMarketPrice) return;
    const ticker = q.symbol.replace(YF_SUFFIX, '');
    priceMap[ticker] = {
      price: +q.regularMarketPrice.toFixed(4),
      chg:   +((q.regularMarketChangePercent ?? 0)).toFixed(2),
    };
  });

  let updated = 0;
  stocks = stocks.map(s => {
    if (priceMap[s.ticker]) { updated++; return { ...s, ...priceMap[s.ticker] }; }
    return s;
  });

  // ── Dividend detection ──
  if (quotes.length) lastDetected = applyDividendDetection(quotes);

  isFetching = false;

  if (updated > 0) {
    save('pse_stocks', stocks);
    lastUpdated = new Date();
    fetchError = null;
  } else {
    fetchError = 'Could not fetch prices — all proxies failed. Try again or check your connection.';
  }

  render();

  if (autoRefreshTimer) clearTimeout(autoRefreshTimer);
  autoRefreshTimer = setTimeout(fetchMarketPrices, 5 * 60 * 1000);
}

function navStatusHTML() {
  if (isFetching) {
    return `<div class="nav-status"><div class="dot fetching"></div>Updating…</div>`;
  }
  if (fetchError) {
    return `<div class="nav-status" style="color:var(--red)" title="${fetchError}"><div class="dot error"></div>Update failed</div>`;
  }
  if (lastUpdated) {
    const mins = Math.round((Date.now() - lastUpdated) / 60000);
    const label = mins < 1 ? 'just now' : mins === 1 ? '1 min ago' : `${mins} min ago`;
    const divNote = lastDetected > 0 ? ` · ${lastDetected} div${lastDetected>1?'s':''} detected` : '';
    return `<div class="nav-status"><div class="dot"></div>Updated ${label}${divNote}</div>`;
  }
  return '<div class="nav-status" style="color:var(--t3);opacity:.7">Prices not fetched</div>';
}

function renderTrades(){
  const sorted = [...trades].sort((a,b)=>b.date.localeCompare(a.date));
  const buys   = sorted.filter(t=>t.type==='buy');
  const totGross   = buys.reduce((s,t)=>s+t.gross,0);
  const totNet     = buys.reduce((s,t)=>s+t.net,0);
  const totComm    = buys.reduce((s,t)=>s+t.comm,0);
  const totShares  = sorted.reduce((s,t)=>s+t.qty,0);

  // Group buy cost per symbol
  const costBySymbol = {};
  buys.forEach(t=>{ costBySymbol[t.symbol]=(costBySymbol[t.symbol]||0)+t.net; });

  const rows = sorted.map(t=>{
    const isDiv = t.type==='stk_div';
    const dateFmt = new Date(t.date+'T00:00:00').toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'2-digit'});

    const rows = stocks.map(s=>`
      <tr>
        <td class="name-cell" style="width:80px"><span class="chip">${s.ticker}</span></td>
        <td><input type="number" step="0.0001" data-ticker="${s.ticker}" data-field="last"
          value="${s.last||''}" placeholder="0.00"
          style="width:100%;padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--s2);color:var(--t1);font-family:'DM Mono',monospace;font-size:12.5px"></td>
        <td><input type="number" step="0.01" data-ticker="${s.ticker}" data-field="chg"
          value="${s.chg||''}" placeholder="0.00"
          style="width:100%;padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--s2);color:var(--t1);font-family:'DM Mono',monospace;font-size:12.5px"></td>
      </tr>`).join('');
    return `<div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="max-width:420px">
        <div class="modal-title">Update Prices</div>
        <div style="font-size:12px;color:var(--t3);margin-bottom:12px">Enter latest prices from your broker. Leave blank to keep existing value.</div>
        <div style="overflow-y:auto;max-height:60vh">
        <table style="width:100%;border-collapse:collapse">
          <thead><tr>
            <th style="padding:6px 4px;text-align:left;font-size:10.5px;font-weight:600;color:var(--t3);text-transform:uppercase">Stock</th>
            <th style="padding:6px 4px;font-size:10.5px;font-weight:600;color:var(--t3);text-transform:uppercase">Last Price (₱)</th>
            <th style="padding:6px 4px;font-size:10.5px;font-weight:600;color:var(--t3);text-transform:uppercase">CHG %</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
        </div>
        <div class="macts" style="margin-top:14px">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="savePrices()">Save All</button>
        </div>
      </div></div>`;
  }
  return '';
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
function setView(v){ view=v; if(v==='dividend'){divTab='upcoming';histPage=1;} render(); }

function openTradeAdd(){ modal={type:'trade-add',data:{}}; render(); }
function openTradeEdit(id){ modal={type:'trade-edit',data:{...trades.find(t=>t.id===id)}}; render(); }
function deleteTrade(id){ if(confirm('Delete this trade?')){ trades=trades.filter(t=>t.id!==id); save('pse_trades',trades); render(); } }
function saveTrade(){
  const symbol = document.getElementById('m_symbol').value;
  const type   = document.getElementById('m_type').value;
  const date   = document.getElementById('m_date').value;
  const qty    = parseFloat(document.getElementById('m_qty').value)||0;
  const price  = parseFloat(document.getElementById('m_price').value)||0;
  const gross  = parseFloat(document.getElementById('m_gross').value)||0;
  const comm   = parseFloat(document.getElementById('m_comm').value)||0;
  const vat    = parseFloat(document.getElementById('m_vat').value)||0;
  const other  = parseFloat(document.getElementById('m_other').value)||0;
  const net    = parseFloat(document.getElementById('m_net').value)||0;
  if(!symbol||!date){ alert('Please select a symbol and date.'); return; }
  if(modal.type==='trade-edit'){
    trades=trades.map(t=>t.id===modal.data.id?{...t,symbol,type,date,qty,price,gross,comm,vat,other,net}:t);
  } else {
    trades.push({id:nextId++,symbol,type,date,qty,price,gross,comm,vat,other,net});
  }
  save('pse_trades',trades); modal=null; render();
}
function setDivTab(t){ divTab=t; histPage=1; render(); }
function setHistPage(p){ const pages=Math.ceil(history.length/PER_PAGE); histPage=Math.max(1,Math.min(p,pages)); render(); }

function openStockAdd(){ modal={type:'stock-add',data:{}}; render(); }
function openStockEdit(id){ modal={type:'stock-edit',data:{...stocks.find(s=>s.id===id)}}; render(); }
function openPriceUpdate(){ modal={type:'price-update'}; render(); }
function savePrices(){
  const inputs = document.querySelectorAll('[data-ticker][data-field]');
  inputs.forEach(inp=>{
    const ticker = inp.dataset.ticker;
    const field  = inp.dataset.field;
    const val    = inp.value.trim();
    if(val==='') return;
    stocks = stocks.map(s=> s.ticker===ticker ? {...s, [field]: +parseFloat(val).toFixed(field==='last'?4:2)} : s);
  });
  save('pse_stocks', stocks);
  lastUpdated = new Date();
  fetchError = null;
  modal = null;
  render();
}
function deleteStock(id){ if(confirm('Remove this stock?')){ stocks=stocks.filter(s=>s.id!==id); save('pse_stocks',stocks); render(); } }

function openUpcomingAdd(){ modal={type:'upcoming-add',data:{}}; render(); }
function openUpcomingEdit(id){ modal={type:'upcoming-edit',data:{...upcoming.find(u=>u.id===id)}}; render(); }
function removeUpcoming(id){ if(confirm('Clear dividend data?')){ upcoming=upcoming.map(u=>u.id===id?{...u,status:'',status_label:'',ex:'',pay:'',per:0,net:0}:u); save('pse_upcoming',upcoming); render(); } }

function openHistAdd(){ modal={type:'hist-add',data:{}}; render(); }
function openHistEdit(id){ modal={type:'hist-edit',data:{...history.find(h=>h.id===id)}}; render(); }
function deleteHist(id){ if(confirm('Delete this income entry?')){ history=history.filter(h=>h.id!==id); save('pse_history',history); render(); } }

function closeModal(){ modal=null; render(); }

function saveStock(){
  const ticker = document.getElementById('m_ticker').value.toUpperCase().trim();
  const last   = parseFloat(document.getElementById('m_last').value)||0;
  const chg    = parseFloat(document.getElementById('m_chg').value)||0;
  if(!ticker){ alert('Please fill in ticker symbol.'); return; }
  if(modal.type==='stock-edit'){
    stocks=stocks.map(s=>s.id===modal.data.id?{...s,ticker,last,chg}:s);
  } else {
    stocks.push({id:nextId++,ticker,last,chg});
    upcoming.push({id:nextId++,stock:ticker,status:'',status_label:'',ex:'',pay:'',shares:0,per:0,net:0});
  }
  save('pse_stocks',stocks); save('pse_upcoming',upcoming);
  modal=null; render();
}

function saveUpcoming(){
  const stock = document.getElementById('m_stock').value;
  const status = document.getElementById('m_status').value;
  const ex = document.getElementById('m_ex').value;
  const pay = document.getElementById('m_pay').value;
  const shares = parseFloat(document.getElementById('m_shares').value)||0;
  const per = parseFloat(document.getElementById('m_per').value)||0;
  const net = parseFloat(document.getElementById('m_net').value)||0;
  const status_label = status==='up'?'Upcoming':status==='cr'?'Credited':'';
  if(modal.type==='upcoming-edit'){
    upcoming=upcoming.map(u=>u.id===modal.data.id?{...u,stock,status,status_label,ex,pay,shares,per,net}:u);
  } else {
    upcoming.push({id:nextId++,stock,status,status_label,ex,pay,shares,per,net});
  }
  save('pse_upcoming',upcoming); modal=null; render();
}

function saveHist(){
  const stock = document.getElementById('m_stock').value;
  const date  = document.getElementById('m_date').value;
  const shares= parseFloat(document.getElementById('m_shares').value)||0;
  const dps   = parseFloat(document.getElementById('m_dps').value)||0;
  const gross = parseFloat(document.getElementById('m_gross').value)||0;
  const tax   = parseFloat(document.getElementById('m_tax').value)||0;
  const net   = parseFloat(document.getElementById('m_net').value)||0;
  if(!stock||!date){ alert('Please select a stock and date.'); return; }
  if(modal.type==='hist-edit'){
    history=history.map(h=>h.id===modal.data.id?{...h,stock,date,shares,dps,gross,tax,net}:h);
  } else {
    history.push({id:nextId++,stock,shares,dps,gross,tax,net,date});
  }
  save('pse_history',history); modal=null; render();
}

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
  // Redraw charts with new colors
  setTimeout(()=>{ Object.values(charts).forEach(c=>c.update()); }, 50);
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
function render(){
  const root = document.getElementById('root');
  let html = renderNav();
  if(view==='portfolio') html += renderPortfolio();
  else if(view==='trades') html += renderTrades();
  else if(view==='dashboard') html += renderDashboard();
  else html += renderDividend();
  html += renderModal();
  root.innerHTML = html;

  // Initialize charts after DOM update
  requestAnimationFrame(()=>{
    if(view==='portfolio') makePortfolioChart();
    else if(view==='dashboard'){ makeDashReturnChart(); makeDashGLChart(); }
    else if(divTab==='upcoming') makeDivMonthly();
    else if(divTab==='history'){ makeDivYearly(); makeDivByStock(); }
  });
}

render();
// Kick off live price fetch immediately on load, then every 5 minutes
fetchMarketPrices();
</script>
